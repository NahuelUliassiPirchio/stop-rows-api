name: Build and test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        env:
          MONGODB_TEST_URI: ${{ secrets.MONGODB_TEST_URI }}
        run: |
          npm install
          npm run build --if-present
          npm test
